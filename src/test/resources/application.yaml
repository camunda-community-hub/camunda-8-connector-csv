# Configuration for running connectors in bundle with connector-runtime

# Cloud connection
# zeebe.client.cloud:
#    region=bru-2
#    clusterId=xxx
#    clientId=xxx
#    clientSecret=xxx


# local connection
# zeebe.client:
#  broker.gateway-address: 127.0.0.1:26500
  # zeebe.client.broker.gateway-address=host.docker.internal:26500
#  security.plaintext: true
# -------------------- Self Manage
camunda.local:
  client:
    mode: selfmanaged
    zeebe:
      enabled: true
      audience: zeebe-api
      gatewayUrl: http://localhost:26500
      restAddress: http://localhost:8088
      preferRestOverGrpc: false
      executionThreads: 200
      defaults:
        maxJobsActive: 58
    operate:
      enabled: false
    tasklist:
      enabled: false
# https://docs.camunda.io/docs/apis-tools/spring-zeebe-sdk/getting-started/
# https://docs.camunda.io/docs/apis-tools/spring-zeebe-sdk/configuration/

camunda:
  client:
    mode: saas
    auth:
      client-id: 8EBpJBGK~M9-1_bjeBBvYDDcHxkV9mYc
      client-secret: 6K18rCDfqUKUTH0WsaCzO0aizonc5e5QAs4L1-3HaAzKIOpwZPjU~QuJq_N1jEj~
    cloud:
      cluster-id: 4d30a9a2-9f76-415e-8acf-5e77362143ce
      region: dsm-1



# -------------------- Self Manage Identity
camundaMultitenant:
  client:
    tenant-ids:
      - red
      - blue
    mode: oidc
    auth:
      clientId: zeebe
      clientSecret: dRFsFFOHsw

      enabled: true
      gatewayUrl: http://localhost:26500
